# Dynamite Headdy - simple Archipelago settings.
# Change the values after the colons. Anything you leave out uses its default.

name: Player                   # your slot name (max 16 characters)
game: Dynamite Headdy

Dynamite Headdy:
  goal: secret_boss            # secret_boss / final_boss / bonus_points
  required_bonus_points: 20    # only used by the bonus_points goal (1-39)
  starting_stage: act_1_1      # act_1_1 ... act_9_3, act_7, or random

  headcases: safe              # off / safe / chaos
  head_trip: true              # allow Head Trip (huge heavy head, a head to avoid)
  flying_heads: false          # Rocket/Air/Feather in normal Headcases
  head_hunter: false           # unused head: enemies sometimes drop pickups
  boss_bomb: true              # keep Bomb Head at the act 7 boss

  jp_balance: false            # easier Japanese difficulty
  jp_palettes: false           # Japanese colours for the 8 changed palettes
  palettes: safe               # off / safe / hue / chaos
  palette_sprites: false       # also recolour Headdy and enemies
  enemy_damage: vanilla        # vanilla / shuffled / half / double
  pickup_shuffle: off          # off / shuffle / randomized
  new_pickups: false           # some beans become upside-down beans (take half your health) or powerup beans
  pickupsanity: false          # every placed jelly bean, 500-point item and 1-up is a check (86)
  trap_percentage: 0           # % of filler items that are traps (Mean Bean, Head Trip)
  mean_bean_trap_weight: 1     # Mean Bean Trap: lose 16 health (never below 2)
  head_trip_trap_weight: 1     # Head Trip Trap: Head Trip goes on for its usual time
  death_link: false            # die when another DeathLink player dies, and vice versa
